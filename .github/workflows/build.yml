name: Build macOS binaries

# The same environment that builds the binaries shipped with ReelsCreator (GitHub-hosted macOS 15 runners,
# default Xcode, nasm/pkgconf/cmake from Homebrew). Started manually; the archives are kept as workflow artifacts.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: brew install nasm pkgconf cmake || true
      - name: Build
        run: bash build.sh ${{ matrix.arch }} "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reelscreator-macos-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/out/reelscreator-macos-${{ matrix.arch }}.tar.gz
            ${{ runner.temp }}/out/reelscreator-macos-${{ matrix.arch }}.tar.gz.sha256
